server.port=${SERVER_PORT:8080}

trofeu.service.url=${TROFEU_SERVICE_URL:http://localhost:8081}

-----------------------------

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

spring.cloud.openfeign.client.config.trofeu-service.connectTimeout=${TROFEU_CONNECT_TIMEOUT:2000}
spring.cloud.openfeign.client.config.trofeu-service.readTimeout=${TROFEU_READ_TIMEOUT:3000}


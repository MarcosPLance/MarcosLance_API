spring.application.name=MarcosLance_api

spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

spring.datasource.url=jdbc:h2:mem:marcosdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.proprerties.hibernate.format_sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.cloud.openfeign.client.config.trofeu-service.connectTimeout=2000
spring.cloud.openfeign.client.config.trofeu-service.readTimeout=2000

